name: Safety regression tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/pikaoikeus-7-safety-foundation]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
