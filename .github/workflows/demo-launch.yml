name: PikaOikeus 7.0 demo launch
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-demo
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/pikaoikeus-7-safety-foundation'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify regression tests
        run: npm test
      - name: Prepare static demo
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          printf '%s\n' 'User-agent: *' 'Disallow: /' > _site/robots.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
