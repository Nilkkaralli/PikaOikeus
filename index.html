<!doctype html><html lang="fi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PikaOikeus AI 7.0 – kehitysversio</title><style>*{box-sizing:border-box}body{font:17px system-ui;background:#0c1728;color:#eef5ff;margin:0}main{max-width:620px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}small{color:#aabdd6}h1{font-size:25px}h2{font-size:28px;text-align:center}button{font:inherit;color:white;background:#286dce;border:0;border-radius:12px;padding:16px;cursor:pointer;width:100%;margin:6px 0}button.alt{background:#243750}#mic{border-radius:50%;width:160px;height:160px;display:block;margin:28px auto;font-size:24px}textarea{width:100%;min-height:90px;background:#172940;color:white;border:1px solid #526980;border-radius:10px;padding:12px;font:inherit}progress{width:100%;accent-color:#81baff}article{background:#172940;padding:18px;border-radius:12px;margin:15px 0;white-space:pre-wrap}.warning{color:#ffcf87}.money{font-size:42px;color:#86dfb5}footer{text-align:center;margin-top:30px}label{display:block;margin:10px 0}button{min-height:56px;font-weight:650;box-shadow:0 3px 0 #101c30}button.alt{border:1px solid #6782a2}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,textarea:focus-visible{outline:3px solid #ffcf87;outline-offset:3px}#mic{background:#2167c4;border:4px solid #8abaff;font-size:20px}#mic.on{background:#a52c40;border-color:#ff9d9d}#status{display:block;text-align:center;min-height:48px;margin:12px 0}textarea{min-height:70px}h2{line-height:1.25}article{border:1px solid #3d5674}button.demo{background:#344c68;border:1px dashed #aabdd6}details{margin:12px 0}summary{cursor:pointer;color:#bfd4ef} </style><main><header><h1>◈ PikaOikeus AI</h1><small>V 7.0 DEV</small></header><small>6.9 ━ <strong>7.0 DEV</strong> · VOICE FIRST</small><hr><div id="app"></div><footer><small>HARJOITUSVERSIO · EI VIRANOMAISPÄÄTÖKSIIN · ÄLÄ SYÖTÄ HENKILÖTIETOJA</small></footer></main><script>
const app=document.getElementById('app');let entries=[],type='',phase='ask',recording=null;
const sets={violence:[['before','Mitä tapahtui ennen lyöntiä?','Olin jonossa.'],['hit','Mihin ja miten sinua lyötiin?','Nyrkillä kasvoihin.'],['injury','Millaisia vammoja tuli?','Mustelma.'],['duration','Kuinka kauan kipu tai haitta kesti?','Ei vielä tiedossa.'],['other','Mitä toinen osapuoli kertoo?','Hän on voimakkaasti päihtynyt.'],['evidence','Onko todistajia tai tallenteita?','Neljä todistajaa, grillimyyjä ja kamera.']],theft:[['object','Mitä vietiin?','Polkupyörä.'],['value','Mikä on omaisuuden arvo?','800 euroa.'],['permission','Oliko ottamiseen lupa?','Ei.'],['evidence','Onko todistajia tai tallenteita?','Valvontakamera.']],threat:[['words','Miten sinua uhattiin?','Uhattiin puukottaa.'],['weapon','Oliko tilanteessa asetta?','Veitsi.'],['safe','Oletko nyt turvassa?','Kyllä.'],['evidence','Onko todistajia tai tallenteita?','Kaksi todistajaa.']],other:[['detail','Mitä tarkalleen tapahtui?','Ei vielä selvitetty.'],['harm','Mitä vahinkoa aiheutui?','Ei tiedossa.'],['evidence','Onko todistajia tai tallenteita?','Ei tiedossa.']]};
function classify(s){return /lyö|löi|potki|nyrk|pahoinpit/i.test(s)?'violence':/varast|anast|vark|pöll/i.test(s)?'theft':/uhka|uhat/i.test(s)?'threat':'other'}
function get(id){return entries.find(e=>e.id===id)?.answer||''}
function question(){if(!entries.length)return ['start','Mitä tapahtui?','Mua lyötiin nakkikioskilla.'];let list=sets[type].slice();if(type==='violence'){if(entries.some(e=>/potki/i.test(e.answer)))list.splice(2,0,['ground','Potkittiinko maassa?','Ei.']);let pos=list.findIndex(q=>q[0]==='other');list.splice(pos,0,...(/mustelm|ruhje|murtum|haava|naarm/i.test(get('injury'))?[]:[['severity','Onko kyse mustelmasta, haavasta, murtumasta vai muusta vammasta?','Mustelma.']]),['care','Kävitkö lääkärissä tai tarvitsetko hoitoa?','En.'],['cost','Paljonko hoitokuluja on tullut euroina?','0 euroa.'],['loss','Paljonko ansioita on jäänyt saamatta euroina?','0 euroa.']);if(/ei.*tied|en tied|epäselv/i.test(get('duration')))list.splice(pos,0,['pain','Onko kipu nyt lievää, kohtalaista vai voimakasta?','Lievää.']);if(/murtu|murtum|tajutto|voimakas|syvä haava/i.test(get('injury')+' '+get('severity')))list.push(['urgent','Onko vamma tutkittu terveydenhuollossa?','Ei vielä.']);}if(type==='violence')list.push(['age','Kuinka vanha asianomistaja on?','30'],['suspectage','Kuinka vanha epäilty on?','32'],['close','Onko kyseessä nykyinen tai entinen puoliso, perheenjäsen tai muu vastaava läheinen?','Ei.'],['work','Kohdistuiko teko henkilöön työtehtävien vuoksi ja epäilty ei kuulu työpaikan henkilöstöön?','Ei.'],['minor','Onko alaikäisellä asianomistajalla erityinen suojan tarve?','Ei tiedossa.'],['relative','Onko asianomistaja alaikäisen epäillyn huoltaja tai sukulainen?','Ei.'],['serious','Käytettiinkö asetta, aiheutuiko vakava vamma tai oliko teko erityisen raaka?','Ei.'],['minorform','Onko poliisin alustava kokonaisarvio lievä pahoinpitely?','Kyllä.'],['demand','Vaatiiko asianomistaja rangaistusta?','Kyllä.']);if(type==='violence'||type==='threat'){if(type==='threat')list.push(['close','Onko kyseessä läheinen henkilö?','Ei.']);list.push(['capacity','Ovatko molemmat nyt kykeneviä ymmärtämään menettelyn?','Ei.'],['facts','Onko epäilty vapaaehtoisesti vahvistanut tapahtumien pääasialliset tosiseikat?','Ei tiedossa.'],['consent','Haluavatko molemmat vapaaehtoisesti sovitteluun?','Ei tiedossa.'],['interest','Onko sovittelu asianomistajan edun mukaista viranomaisen alustavan arvion mukaan?','Ei tiedossa.']);}return list.find(q=>!entries.some(e=>e.id===q[0]));}
function euros(s){
  const input=String(s??'').trim();
  if(!input || /^(?:ei tiedossa|en tiedä|epäselvä|tuntematon)$/i.test(input)) return null;
  const match=input.match(/(?:^|\s)(\d{1,3}(?:[ \u00a0]\d{3})+|\d+)(?:([,.])(\d{1,2}))?(?=\s|€|$)/);
  if(!match) return null;
  const amount=Number(match[1].replace(/[ \u00a0]/g,'')+'.'+(match[3]||'0'));
  return Number.isFinite(amount)&&amount>=0?amount:null;
}
function outcome(){if(type==='theft')return euros(get('value'));if(type!=='violence')return null;let injury=get('injury')+' '+get('severity');if(/murtu|murtum|tajutto|syvä haava/i.test(injury))return null;if(/mustelm|ruhje|haava|naarm|kipu|särky|ei vam/i.test(injury)){let base=/ei vam/i.test(injury)?0:350;const cost=euros(get('cost')),loss=euros(get('loss'));if(cost===null||loss===null)return null;return base+cost+loss;}return null;}
function legal(){const yes=k=>/^kyllä(?:\b|[.!?,\s])/i.test(get(k).trim()),no=k=>/^ei[.!?]?$|^ei,\s*ei\b(?!\s+(?:tiedossa|tietoa|varma|osaa|muista))|^ei\s+(?:ole|ollut|käytetty|kohdistunut)\b/i.test(get(k).trim()),age=k=>/^\d{1,3}(?:\s*(?:v|vuotta))?[.!]?$/i.test(get(k).trim())?parseInt(get(k)):null;let a=age('age'),b=age('suspectage'),m=yes('minorform')&&no('serious'),close=yes('close'),publicCase=type==='violence'&&(!m||a!==null&&a<18||close||yes('work')),uncertain=type==='violence'&&m&&!publicCase&&(a===null||!no('close')||!no('work'));let prosecution=type==='violence'?(publicCase?(!m?'Virallinen syyte mahdollinen: rikosnimike tarkistettava.':'Virallisen syytteen alainen alustavasti (RL 21:16).'):uncertain?'Syyteoikeus selvitettävä.':'Alustavasti asianomistajarikos; rangaistusvaatimus: '+get('demand')):'Syyteoikeus tarkistettava erikseen.';if(type==='violence'&&b!==null&&b<15)prosecution='Alle 15-vuotias: ei rikosoikeudellista vastuuta; muut toimet arvioitava.';let block=(type==='violence'||type==='threat')&&close;let exception=type==='violence'&&m&&b!==null&&b<18&&yes('relative');let mediation=block&&!exception?'Läheiseen kohdistuva teko: älä ohjaa sovitteluun ilman poikkeuksen oikeudellista tarkistusta (3 a §).':type==='violence'&&(a===null||a<18&&!no('minor'))?'Alaikäisen erityinen suojan tarve selvitettävä; ei sovitteluun tässä vaiheessa.':exception?'Mahdollinen 3 a § poikkeus: vain viranomaisaloite, asiantuntijatarkistus.':(type==='violence'||type==='threat')&&no('close')&&yes('capacity')&&yes('facts')&&yes('consent')&&yes('interest')?'Mahdollinen ohjaus sovittelutoimistoon; toimisto päättää.':'Ei automaattista sovitteluun ohjausta; edellytykset tarkistettava.';return 'LEGAL GATE\n'+prosecution+'\n'+mediation+'\nKorvausvaatimus käsitellään erikseen. Sovinto ei automaattisesti päätä rikosprosessia.';}
function report(){return entries.map(e=>e.q+'\n'+e.answer).join('\n\n')}
function law(){return ({violence:'RL 21:5, 21:7, 21:16; RL 4:4',theft:'RL 28:1 ja 28:3',threat:'RL 25:7',other:'Selvitettävä'})[type]}
function el(tag,text,parent=app){let e=document.createElement(tag);e.textContent=text;parent.append(e);return e}function btn(text,fn,cls=''){let b=el('button',text);b.className=cls;b.onclick=fn;return b}
function accept(q,a){if(recording||!a.trim())return;entries.push({id:q[0],q:q[1],answer:a.trim()});if(q[0]==='start')type=classify(a);if(!question())phase='report';render()}
function render(){app.replaceChildren();if(phase==='ask'){let q=question();el('small','Kysymys '+(entries.length+1));el('h2',q[1]);let mic=btn('🎙 MIKKI OFF – Puhu',()=>speak());mic.id='mic';mic.setAttribute('aria-pressed','false');let status=el('small','Mikrofoni pois päältä. Paina aloittaaksesi.');status.id='status';status.setAttribute('role','status');let ta=el('textarea','');ta.placeholder='Puheesta tunnistettu vastaus';ta.setAttribute('aria-label','Vastaus');let next=btn('Hyväksy vastaus →',()=>{if(ta.value.trim())accept(q,ta.value)});next.disabled=true;ta.oninput=()=>{next.disabled=!ta.value.trim()||!!recording};btn('En tiedä',()=>accept(q,'Ei tiedossa.'),'alt');btn('Kokeile ilman mikrofonia (demo)',()=>accept(q,q[2]),'demo');if(entries.length)btn('← Edellinen kysymys',()=>{if(recording)return;entries.pop();if(!entries.length)type='';render()},'alt');function speak(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Selain ei tue puheentunnistusta. Käytä näppäimistön mikrofonia tai demovastausta.';return}try{if(recording){recording.stop();return}let r=new SR();recording=r;r.lang='fi-FI';r.onresult=e=>{ta.value=e.results[0][0].transcript;status.textContent='Vastaus tunnistettu. Tarkista ja paina Jatka.'};r.onerror=()=>{status.textContent='Mikrofoni ei käytettävissä. Kokeile demovastausta.'};r.onend=()=>{recording=null;mic.textContent='🎙 MIKKI OFF – Puhu';mic.classList.remove('on');mic.setAttribute('aria-pressed','false');next.disabled=!ta.value.trim()};r.start();mic.textContent='■ MIKKI ON – Lopeta';mic.classList.add('on');mic.setAttribute('aria-pressed','true');next.disabled=true;status.textContent='Kuunnellaan… Paina lopettaaksesi.'}catch(e){recording=null;status.textContent='Puheentunnistus ei käynnistynyt.'}}}else if(phase==='report'){el('h2','Tapahtumaselvitys');btn('← Täydennä viimeistä vastausta',()=>{entries.pop();phase='ask';render()},'alt');el('article',report()+'\n\nMahdolliset lainkohdat: '+law()+'\nTiedot vahvistamatta.');btn('Lähetä arviointiin',()=>{phase='result';render()})}else{el('h2','Alustava ratkaisuehdotus');let amount=outcome();if(amount!==null){el('small','HEVA-moduuli · kuvitteellinen demotaso');el('div',amount+' €').className='money';el('p',type==='violence'?'Demon oletus: lievä vamma 350 € (kuvitteellinen väli 200–500 €), tai 0 € jos ei vammaa, sekä ilmoitetut kulut '+euros(get('cost'))+' € ja ansionmenetys '+euros(get('loss'))+' €. Ei tarkistettu HEVA-arvio.':'Ilmoitettu omaisuuden arvo; palautus ja todellinen vahinko tarkistettava.')}else el('article','Ei vahvistettua korvausarviota. Jos kyse olisi vain lievästä ruhjeesta, harjoitusesimerkki olisi 350 € (200–500 €). Tämä ehdollinen esimerkki ei sovellu vakavan tai epäselvän vamman korvaukseksi. Asiantuntija arvioi asian.');el('article','Justice Gate: tarkista syyttömyysolettama, tasapuolisuus, itsekriminointisuoja, oikeus avustajaan, kuulustelukunto ja vapaaehtoisuus.').classList.add('warning');el('article',legal());let src=el('p','Lähteet: ');for(const [name,url] of [['Rikoslaki 21:16','https://www.finlex.fi/fi/lainsaadanto/1889/39-001'],['Sovittelulaki 2, 3, 3 a ja 13 §','https://www.finlex.fi/fi/lainsaadanto/2005/1015']]){let link=el('a',name+' · ',src);link.href=url;link.style.color='#a9cfff';link.target='_blank';link.rel='noopener'}el('article','Vaihtoehdot: esitutkinnan jatkaminen, sovittelun arviointi tai sakkomenettelyn edellytysten tarkistus. Sovinto ei automaattisesti päätä rikosprosessia. Asiantuntijan tarkistus tarvitaan.');btn('Tallenna raportti',()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([report()+'\n\nMahdolliset lainkohdat: '+law()+'\nDemoehdotus: '+(amount===null?'Ei arviota':amount+' euroa')+'\n'+legal()+'\nEi virallinen päätös.'],{type:'text/plain;charset=utf-8'}));a.download='pikaoikeus-raportti.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)})}if(entries.length)btn('Aloita alusta',()=>{if(recording)return;if(!confirm('Poistetaanko tämän tapauksen vastaukset?'))return;entries=[];type='';phase='ask';render()},'alt')}
render();
</script></html>
